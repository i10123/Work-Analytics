<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="100%" height="100%">
  <defs>
    <!-- Использование цвета свечения для фильтра -->
    <filter id="appThemeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Мягкий градиент для шлейфа радара -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="var(--color-accent)" stop-opacity="0.25" />
      <stop offset="100%" stop-color="var(--color-accent)" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    /* Линейное вращение сканирующего луча радара */
    .radar-sweep-line {
      transform-origin: 75px 75px;
      animation: radarScan 6s linear infinite;
    }

    /* Эффект парения стека, аналогичный floatOrb из app-layout.css */
    .glowing-stack {
      animation: floatStack 4s ease-in-out infinite;
    }

    /* Пульсация найденных вакансий-маркеров */
    .vacancy-blip-1 {
      transform-origin: 118px 46px;
      animation: blipGlow 2s infinite ease-in-out;
    }
    .vacancy-blip-2 {
      transform-origin: 32px 88px;
      animation: blipGlow 2.5s infinite ease-in-out;
    }

    @keyframes radarScan {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes floatStack {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes blipGlow {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.35); opacity: 1; }
    }
  </style>

  <!-- ФОНОВЫЕ ЭЛЕМЕНТЫ И РАЗМЕТКА РАДАРА -->
  <g>
    <!-- Внешнее кольцо радара -->
    <circle cx="75" cy="75" r="66" stroke="var(--color-primary)" stroke-width="1.2" stroke-opacity="0.2" fill="none" />
    <!-- Внутреннее пунктирное кольцо -->
    <circle cx="75" cy="75" r="44" stroke="var(--color-accent)" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 3" fill="none" />
    <!-- Центральное мини-кольцо -->
    <circle cx="75" cy="75" r="22" stroke="var(--color-primary)" stroke-width="1" stroke-opacity="0.15" fill="none" />

    <!-- Координатные оси -->
    <line x1="75" y1="12" x2="75" y2="138" stroke="var(--color-accent)" stroke-opacity="0.1" stroke-width="1" />
    <line x1="12" y1="75" x2="138" y2="75" stroke="var(--color-accent)" stroke-opacity="0.1" stroke-width="1" />

    <!-- Плавная горизонтальная волна (дублирует визуальный стиль welcomeCanvas) -->
    <path d="M 12 98 Q 43.5 110, 75 98 T 138 98" stroke="var(--color-primary)" stroke-opacity="0.18" stroke-width="1.5" fill="none" />
  </g>

  <!-- ВРАЩАЮЩИЙСЯ ЛУЧ (В стиле приветственного экрана) -->
  <g class="radar-sweep-line">
    <path d="M 75 75 L 138 52 A 66 66 0 0 0 102 12.8 Z" fill="url(#sweepGrad)" />
    <line x1="75" y1="75" x2="141" y2="75" stroke="var(--color-accent)" stroke-width="1.8" filter="url(#appThemeGlow)" />
  </g>

  <!-- СВЕТЯЩЕЕСЯ ЯДРО СТЕКА -->
  <line class="glowing-stack" x1="75" y1="46" x2="75" y2="102" stroke="var(--color-primary)" stroke-width="3" filter="url(#appThemeGlow)" stroke-linecap="round" />

  <!-- ЛЕВИТИРУЮЩИЙ 3D-СТЭК (Цветовая гамма меняется вместе с темой приложения) -->
  <g class="glowing-stack">
    <!-- Нижний слой (Объемное ребро + Грань) -->
    <g>
      <polygon points="50 94, 50 97, 75 107, 100 97, 100 94, 75 104" fill="var(--color-border-light)" opacity="0.4" />
      <polygon points="75 83, 100 94, 75 104, 50 94" fill="var(--glass-bg)" stroke="var(--color-border)" stroke-width="1" />
    </g>

    <!-- Средний слой (Объемное ребро + Грань) -->
    <g>
      <polygon points="50 74, 50 77, 75 87, 100 77, 100 74, 75 84" fill="var(--color-border-light)" opacity="0.6" />
      <polygon points="75 63, 100 74, 75 84, 50 74" fill="var(--glass-bg)" stroke="var(--color-accent)" stroke-width="1.2" />
    </g>

    <!-- Верхний слой (Объемный светящийся элемент) -->
    <g filter="url(#appThemeGlow)">
      <polygon points="50 54, 50 57, 75 67, 100 57, 100 54, 75 64" fill="var(--color-accent)" opacity="0.5" />
      <polygon points="75 43, 100 54, 75 64, 50 54" fill="var(--glass-bg)" stroke="var(--color-primary)" stroke-width="1.8" />
    </g>
  </g>

  <!-- НАЙДЕННЫЕ ВАКАНСИИ (Пульсирующие маркеры-блипы) -->
  <circle class="vacancy-blip-1" cx="118" cy="46" r="4" fill="var(--color-primary)" filter="url(#appThemeGlow)" />
  <circle class="vacancy-blip-2" cx="32" cy="88" r="3" fill="var(--color-accent)" filter="url(#appThemeGlow)" />
</svg>
